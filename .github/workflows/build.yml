name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build the root project and its ports
        run: ./gradlew build "-Porg.gradle.java.installations.paths=$JAVA_HOME_17_X64,$JAVA_HOME_21_X64,$JAVA_HOME_25_X64"

      - name: Build Forge 1.7.10
        run: ./gradlew -p ports/forge-1.7.10 build "-Porg.gradle.java.installations.paths=$JAVA_HOME_8_X64"

      - name: Build Forge 1.12.2
        run: ./gradlew -p ports/forge-1.12.2 build "-Porg.gradle.java.installations.paths=$JAVA_HOME_8_X64"
