pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

def ports = [
        'forge-1.19.3',
        'forge-1.19.4',
        'forge-1.20',
        'forge-1.20.1',
        'neoforge-1.21.2',
        'neoforge-1.21.3',
        'neoforge-1.21.4',
        'neoforge-26.1',
        'neoforge-26.1.1',
        'neoforge-26.1.2',
        'neoforge-26.2',
        'neoforge-26.3',
]
ports.each { name ->
    include(name)
    project(":${name}").projectDir = file("ports/${name}")
}
